spring:
  application:
    name: 100mph-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/hundredmph}
      auto-index-creation: true
  jackson:
    # The client's types.ts is snake_case end to end (full_name, access_token).
    # Java stays camelCase; the wire format is decided here, once.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false

app:
  jwt:
    # Dev-only fallback. Production MUST set JWT_SECRET (>= 32 bytes).
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-you-ship-0123456789}
    issuer: https://api.100mph.in
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  auth:
    # Throttle per §5.1: failed logins per email, then a lock.
    max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:10}
    failed-login-window: ${AUTH_FAILED_LOGIN_WINDOW:PT15M}
    lock-duration: ${AUTH_LOCK_DURATION:PT30M}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:PT1H}
    min-password-length: 8
  cors:
    # Explicit origins — the only ones honoured in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Dev convenience: accept any localhost port, because Expo's web server
    # picks whichever one is free. MUST be false in production.
    allow-local-dev-origins: ${CORS_ALLOW_LOCAL_DEV_ORIGINS:true}
  seed:
    # Seeds programs, plans and the demo accounts from the app's mock.ts.
    # Turn this off the moment real data exists.
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    in.hundredmph.api: DEBUG
