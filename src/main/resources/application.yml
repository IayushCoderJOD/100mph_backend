spring:
  application:
    name: 100mph-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/hundredmph}
      auto-index-creation: true
  jackson:
    # The client's types.ts is snake_case end to end (full_name, access_token).
    # Java stays camelCase; the wire format is decided here, once.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false

server:
  # 8080 is Spring's default but it is not free on the dev machines here — a
  # Keycloak container for an unrelated project publishes it. 8090 is ours;
  # override with PORT for anything else.
  port: ${PORT:8090}
  error:
    whitelabel:
      enabled: false

app:
  jwt:
    # Dev-only fallback. Production MUST set JWT_SECRET (>= 32 bytes).
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-you-ship-0123456789}
    issuer: https://api.100mph.in
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  auth:
    # Throttle per §5.1: failed logins per email, then a lock.
    max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:10}
    failed-login-window: ${AUTH_FAILED_LOGIN_WINDOW:PT15M}
    lock-duration: ${AUTH_LOCK_DURATION:PT30M}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:PT1H}
    min-password-length: 8
  cors:
    # Explicit origins — the only ones honoured in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Dev convenience: accept any localhost port, because Expo's web server
    # picks whichever one is free. MUST be false in production.
    allow-local-dev-origins: ${CORS_ALLOW_LOCAL_DEV_ORIGINS:true}
  seed:
    # Seeds programs, plans and the demo accounts from the app's mock.ts.
    # Turn this off the moment real data exists.
    enabled: ${SEED_ENABLED:true}
  media:
    # Cloudflare R2, through its S3 API, for videos uploaded from the admin's
    # exercise library. Leave the keys blank to switch uploads off; everything
    # else keeps working. Create the key in Cloudflare → R2 → Manage API tokens
    # with "Object Read & Write" on the one bucket.
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:100mph-media}
    # Only for a local S3 stand-in; blank means https://<account-id>.r2.cloudflarestorage.com.
    endpoint: ${R2_ENDPOINT:}
    upload-prefix: ${R2_UPLOAD_PREFIX:demos/uploads}
    max-video-mb: ${MEDIA_MAX_VIDEO_MB:150}
  bootstrap:
    # The first admin of a fresh deployment, created once if no account has
    # this email. Needed in production, where seeding is off. 12+ characters.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:100mph Admin}

logging:
  level:
    in.hundredmph.api: DEBUG
