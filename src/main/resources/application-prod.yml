app:
  jwt:
    # No fallback in production: a missing JWT_SECRET must stop the boot. The
    # dev default in application.yml is in the repository, so anyone could
    # sign an admin token with it.
    secret: ${JWT_SECRET}
  seed:
    enabled: false
  cors:
    # Production trusts only what CORS_ALLOWED_ORIGINS names.
    allow-local-dev-origins: false
logging:
  level:
    in.hundredmph.api: INFO
